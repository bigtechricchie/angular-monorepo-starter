<section>
  <h2>{{ translation.title }}</h2>

  <p>{{ translation.description }}</p>

  <app-health-check-status [isLoading]="isLoading()" [status]="response()?.status" [errorMessage]="errorMessage()"
    [actionLabel]="translation.actionLabel" [loadingLabel]="translation.loadingLabel"
    [statusLabel]="translation.statusLabel" (checkRequested)="checkHealth()" />
</section>
