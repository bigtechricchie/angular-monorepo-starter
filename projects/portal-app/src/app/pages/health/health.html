<section>
  <h2>Health</h2>

  <button type="button" [disabled]="isLoading()" (click)="checkHealth()">
    Check API health
  </button>

  @if (isLoading()) {
  <p role="status">
    Checking API health...
  </p>
  } @else if (errorMessage(); as message) {
  <p role="alert">
    {{ message }}
  </p>
  } @else if (response(); as health) {
  <p role="status">
    API status:
    <strong>{{ health.status }}</strong>
  </p>
  }
</section>
