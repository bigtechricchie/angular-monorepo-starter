<section class="health">
  <h1>Health check</h1>

  <p>Check whether the API is available.</p>

  @let current = healthCheck();

  <button type="button" [disabled]="current.state === states.loading" (click)="checkHealth()">
    Check API
  </button>

  @switch (current.state) {
  @case (states.loading) {
  <p>Checking API…</p>
  }

  @case (states.success) {
  <p>API status: {{ current.status }}</p>
  }

  @case (states.error) {
  <p>Health check failed: {{ current.message }}</p>
  }
  }
</section>
