<div class="health-check-status">
  <button type="button" [disabled]="isLoading()" (click)="requestCheck()">{{ actionLabel() }}</button>

  @if (isLoading()) {
  <p class="health-check-status__message" role="status">
    {{ loadingLabel() }}
  </p>
  } @else if (errorMessage(); as message) {
  <p class="health-check-status__message" role="alert">
    {{ message }}
  </p>
  } @else if (status(); as value) {
  <p class="health-check-status__message" role="status">
    {{ statusLabel() }}
    <strong>{{ value }}</strong>
  </p>
  }
</div>
